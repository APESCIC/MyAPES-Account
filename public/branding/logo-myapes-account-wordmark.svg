<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">MyAPES Account wordmark</title>
  <desc id="desc">APES-style horizontal logo variant with the wording MyAPES Account.</desc>
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1800" height="760" fill="none"/>
  <g filter="url(#shadow)">
    <rect x="24" y="24" width="1752" height="712" rx="36" fill="url(#surface)"/>
  </g>
  <rect x="24" y="24" width="1752" height="20" rx="10" fill="url(#accent)"/>

  <g transform="translate(88 86)">
    <circle cx="86" cy="82" r="62" fill="#0f766e"/>
    <circle cx="86" cy="82" r="42" fill="#ffffff"/>
    <circle cx="86" cy="82" r="28" fill="#0f766e"/>
    <circle cx="32" cy="30" r="18" fill="#d97706"/>
    <circle cx="140" cy="30" r="18" fill="#d97706"/>
    <circle cx="20" cy="108" r="15" fill="#1d4ed8"/>
    <circle cx="152" cy="108" r="15" fill="#1d4ed8"/>
  </g>

  <g transform="translate(300 0)">
    <text x="0" y="336" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="800" letter-spacing="1.5">MyAPES Account</text>
    <text x="2" y="420" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="600">Association of Protecting Exotic Species CIC</text>
    <rect x="0" y="462" width="1110" height="12" rx="6" fill="url(#accent)"/>
    <text x="2" y="546" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Support • Shelter • Pet Care</text>
  </g>
</svg>
