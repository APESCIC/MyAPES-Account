name: Test and deploy MyAPES Account

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudron-3465c63f-0e1b-4e49-8f5f-799a471055a1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-control-authentication:
    name: Authenticate deployment controls from Git
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployment_controls_sha256: ${{ steps.authenticate.outputs.deployment_controls_sha256 }}
    steps:
      - name: Derive deployment-control digest from exact revision
        id: authenticate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          requested_ref="$REQUESTED_REVISION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_ref="refs/heads/main"
          fi

          authentication_root="$(mktemp -d)"
          trap 'rm -rf -- "$authentication_root"' EXIT
          repository_root="$authentication_root/repository"
          controls_root="$authentication_root/controls"
          git init --quiet "$repository_root"
          git -C "$repository_root" remote add origin \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')"
          git -C "$repository_root" \
            -c "http.extraHeader=AUTHORIZATION: basic $authorization" \
            fetch --quiet --depth=1 origin "$requested_ref"
          unset authorization GITHUB_TOKEN
          release_sha="$(git -C "$repository_root" rev-parse FETCH_HEAD)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            [[ "$release_sha" == "$REQUESTED_REVISION" ]]
          fi

          deployment_control_paths=(
            scripts/deploy/activate-release.sh
            scripts/deploy/rollback-release.sh
            scripts/deploy/cloudron-app.conf
            scripts/deploy/cloudron-run.sh
          )
          install -d -m 0700 "$controls_root"
          : > "$controls_root/DEPLOYMENT-CONTROLS.sha256"
          for control_path in "${deployment_control_paths[@]}"; do
            install -d -m 0700 "$controls_root/$(dirname "$control_path")"
            git -C "$repository_root" show \
              "$release_sha:$control_path" > "$controls_root/$control_path"
            test -s "$controls_root/$control_path"
            control_digest="$(sha256sum "$controls_root/$control_path" | awk '{print $1}')"
            printf '%s  %s\n' "$control_digest" "$control_path" \
              >> "$controls_root/DEPLOYMENT-CONTROLS.sha256"
          done
          deployment_controls_sha256="$(sha256sum "$controls_root/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$deployment_controls_sha256" =~ ^[0-9a-f]{64}$ ]]
          (
            cd "$controls_root"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )
          echo "deployment_controls_sha256=$deployment_controls_sha256" \
            >> "$GITHUB_OUTPUT"

  quality:
    name: SQLite test and package
    needs: deployment-control-authentication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      app_version: ${{ steps.release.outputs.app_version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_sha="$(git rev-parse HEAD)"
          app_version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full Git commit SHA."
            exit 1
          fi
          if [[ ! "$app_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unable to resolve a valid semantic app version."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch origin main
            test "$release_sha" = "$(git rev-parse origin/main)"
          fi

          {
            echo "sha=$release_sha"
            echo "app_version=$app_version"
            echo "artifact_name=myapes-release-$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci --no-audit --no-fund

      - name: Validate source-controlled release history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_ref=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_ref="$PUSH_BASE_SHA"
          fi

          if [[ -n "$base_ref" ]]; then
            php artisan myapes:changelog-validate --base-ref="$base_ref" --no-interaction
          else
            php artisan myapes:changelog-validate --no-interaction
          fi

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/deploy/*.sh scripts/local/*.sh; do
            bash -n "$script"
          done

      - name: Run frontend tests
        run: |
          node --check scripts/local/dev-runner.mjs
          npm run test:frontend

      - name: Validate local PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -LiteralPath scripts/local -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null
              $parseErrors += $errors
          }

          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: composer test

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --classmap-authoritative

      - name: Package exact release
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TRUSTED_CONTROLS_SHA256: ${{ needs.deployment-control-authentication.outputs.deployment_controls_sha256 }}
        run: |
          set -euo pipefail

          mkdir -p build/release
          rsync -a ./ build/release/ \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.env' \
            --exclude '/.env.*' \
            --exclude '/build/' \
            --exclude '/design-qa.md' \
            --exclude '/docs/' \
            --exclude '/node_modules/' \
            --exclude '/scripts/local/' \
            --exclude '/storage/' \
            --exclude '/tests/' \
            --exclude '/public/hot' \
            --exclude '/public/storage' \
            --exclude '/.phpunit.cache/' \
            --exclude '/.phpunit.result.cache'

          printf '%s\n' "$RELEASE_SHA" > build/release/REVISION
          deployment_control_paths=(
            scripts/deploy/activate-release.sh
            scripts/deploy/rollback-release.sh
            scripts/deploy/cloudron-app.conf
            scripts/deploy/cloudron-run.sh
          )
          : > build/release/DEPLOYMENT-CONTROLS.sha256
          for control_path in "${deployment_control_paths[@]}"; do
            control_digest="$(sha256sum "build/release/$control_path" | awk '{print $1}')"
            printf '%s  %s\n' "$control_digest" "$control_path" \
              >> build/release/DEPLOYMENT-CONTROLS.sha256
          done
          deployment_controls_sha256="$(sha256sum build/release/DEPLOYMENT-CONTROLS.sha256 | awk '{print $1}')"
          [[ "$deployment_controls_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$deployment_controls_sha256" == "$TRUSTED_CONTROLS_SHA256" ]]
          tar --create --gzip --file "build/myapes-$RELEASE_SHA.tar.gz" --directory build/release .
          test -s "build/myapes-$RELEASE_SHA.tar.gz"

          tar --list --gzip --file "build/myapes-$RELEASE_SHA.tar.gz" > build/archive-list.txt
          grep -qx './REVISION' build/archive-list.txt
          grep -qx './VERSION' build/archive-list.txt
          grep -qx './artisan' build/archive-list.txt
          grep -qx './public/build/manifest.json' build/archive-list.txt
          grep -qx './resources/data/releases.json' build/archive-list.txt
          grep -qx './resources/data/module-runtime-contract.json' build/archive-list.txt
          grep -qx './config/modules.php' build/archive-list.txt
          grep -qx './config/permission.php' build/archive-list.txt
          grep -qx './database/migrations/2026_07_28_000000_create_permission_tables.php' build/archive-list.txt
          grep -qx './database/migrations/2026_07_28_000100_cut_over_authorization_domain.php' build/archive-list.txt
          grep -qx './database/migrations/2026_08_06_000000_create_module_installations_table.php' build/archive-list.txt
          grep -qx './app/Console/Commands/AuthorizationPreflight.php' build/archive-list.txt
          grep -qx './app/Console/Commands/DirectorySync.php' build/archive-list.txt
          grep -qx './app/Console/Commands/AuthorizationSync.php' build/archive-list.txt
          grep -qx './app/Console/Commands/AuthorizationCheck.php' build/archive-list.txt
          grep -qx './app/Console/Commands/ModulesPreflight.php' build/archive-list.txt
          grep -qx './app/Console/Commands/ModulesSync.php' build/archive-list.txt
          grep -qx './app/Console/Commands/ModulesCheck.php' build/archive-list.txt
          grep -qx './app/Console/Commands/ModulesRollbackCheck.php' build/archive-list.txt
          grep -qx './app/Services/ModuleRollbackCompatibilityChecker.php' build/archive-list.txt
          grep -qx './scripts/deploy/activate-release.sh' build/archive-list.txt
          grep -qx './scripts/deploy/rollback-release.sh' build/archive-list.txt
          grep -qx './scripts/deploy/cloudron-app.conf' build/archive-list.txt
          grep -qx './scripts/deploy/cloudron-run.sh' build/archive-list.txt
          grep -qx './scripts/deploy/production.env.example' build/archive-list.txt
          grep -qx './DEPLOYMENT-CONTROLS.sha256' build/archive-list.txt

          if grep -Eq '^\./(\.git($|/)|\.env($|\.)|docs/|node_modules/|scripts/local/|storage/|tests/)' build/archive-list.txt; then
            echo "Release archive contains an excluded path."
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: build/myapes-${{ steps.release.outputs.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  database-compatibility:
    name: Authorization and module database contract (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            health: mysqladmin ping --host=127.0.0.1 --user=root --silent
          - engine: MariaDB 11.4
            image: mariadb:11.4
            connection: mariadb
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: myapes_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: myapes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 1

      - name: Set up PHP 8.4 with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, pdo_mysql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run authorization and module database contract
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: myapes_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          DB_URL: ''
        run: |
          php artisan test \
            tests/Feature/AuthorizationSchemaTest.php \
            tests/Feature/AuthorizationRoleMaterializerTest.php \
            tests/Feature/AuthorizationCutoverGuardTest.php \
            tests/Feature/AuthorizationCutoverConcurrencyTest.php \
            tests/Feature/PermissionSchemaMigrationTest.php \
            tests/Feature/AccessCompatibilityMigrationTest.php \
            tests/Feature/AccessCompatibilityCommandTest.php \
            tests/Feature/RolelessApplicationCompatibilityTest.php \
            tests/Feature/UserAccessCompatibilityTest.php \
            tests/Feature/AuthorizationLifecycleCommandTest.php \
            tests/Feature/DirectoryCatalogueSynchronizerTest.php \
            tests/Feature/DirectorySyncWiringTest.php \
            tests/Feature/Auth/DirectoryRevalidationTest.php \
            tests/Feature/DirectoryGroupMappingServiceTest.php \
            tests/Feature/DirectoryRoleSynchronizerTest.php \
            tests/Feature/ModuleRegistryTest.php \
            tests/Feature/ModuleInstallationSynchronizationTest.php \
            tests/Feature/ModuleLifecycleTest.php \
            tests/Feature/ModuleLifecycleConcurrencyTest.php \
            tests/Feature/ModuleRollbackCompatibilityTest.php

          php artisan migrate:fresh --seed --force --no-interaction
          php tests/Support/directory-sync-timeout-probe.php prepare
          set +e
          php artisan queue:work database \
            --stop-when-empty \
            --queue=security-timeout \
            --sleep=1 \
            --timeout=2 \
            --tries=1
          worker_status=$?
          set -e
          echo "Timeout probe worker exit status: $worker_status"
          php tests/Support/directory-sync-timeout-probe.php assert

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Deploy to Cloudron
    needs: [deployment-control-authentication, quality, database-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudron-deploy
    env:
      CLOUDRON_APP_ID: 3465c63f-0e1b-4e49-8f5f-799a471055a1
      CLOUDRON_APP_URL: https://myaccount.myapes.me.uk
      CLOUDRON_OIDC_AUTH_URL: https://my.cloudron.apes.org.uk/openid/auth
      CLOUDRON_OIDC_REDIRECT_URI: https://myaccount.myapes.me.uk/staff/auth/callback
      CLOUDRON_FQDN: ${{ secrets.CLOUDRON_FQDN }}
      CLOUDRON_TOKEN: ${{ secrets.CLOUDRON_TOKEN }}
      RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
      APP_VERSION: ${{ needs.quality.outputs.app_version }}
      DEPLOYMENT_CONTROLS_SHA256: ${{ needs.deployment-control-authentication.outputs.deployment_controls_sha256 }}
    steps:
      - name: Download tested release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.quality.outputs.artifact_name }}
          path: build

      - name: Validate Cloudron configuration
        shell: bash
        run: |
          set -euo pipefail

          for required_name in CLOUDRON_FQDN CLOUDRON_TOKEN CLOUDRON_APP_ID RELEASE_SHA APP_VERSION DEPLOYMENT_CONTROLS_SHA256; do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required Cloudron deployment value: $required_name"
              exit 1
            fi
          done

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$DEPLOYMENT_CONTROLS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -s "build/myapes-$RELEASE_SHA.tar.gz"

          verification_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verification_dir"' EXIT
          tar --extract --gzip \
            --file "build/myapes-$RELEASE_SHA.tar.gz" \
            --directory "$verification_dir" \
            ./DEPLOYMENT-CONTROLS.sha256 \
            ./scripts/deploy/activate-release.sh \
            ./scripts/deploy/rollback-release.sh \
            ./scripts/deploy/cloudron-app.conf \
            ./scripts/deploy/cloudron-run.sh
          test -f "$verification_dir/DEPLOYMENT-CONTROLS.sha256"
          test ! -L "$verification_dir/DEPLOYMENT-CONTROLS.sha256"
          for control_path in \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh; do
            test -f "$verification_dir/$control_path"
            test ! -L "$verification_dir/$control_path"
          done
          actual_controls_sha256="$(sha256sum "$verification_dir/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$actual_controls_sha256" == "$DEPLOYMENT_CONTROLS_SHA256" ]]
          cat >"$verification_dir/expected-control-paths" <<'PATHS'
          scripts/deploy/activate-release.sh
          scripts/deploy/rollback-release.sh
          scripts/deploy/cloudron-app.conf
          scripts/deploy/cloudron-run.sh
          PATHS
          awk '{print $2}' "$verification_dir/DEPLOYMENT-CONTROLS.sha256" \
            >"$verification_dir/actual-control-paths"
          diff -u \
            "$verification_dir/expected-control-paths" \
            "$verification_dir/actual-control-paths"
          (
            cd "$verification_dir"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )

      - name: Install pinned Cloudron CLI
        run: npm install --global cloudron@8.2.6

      - name: Create pre-deployment backup
        shell: bash
        run: |
          set -euo pipefail
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            backup create --app "$CLOUDRON_APP_ID"

      - name: Capture current release identity for rollback verification
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --max-time 10 "$CLOUDRON_APP_URL/healthz" || true)"
          previous_version="$(jq -r '.version // empty' <<<"$response" 2>/dev/null || true)"
          previous_release="$(jq -r '.release // empty' <<<"$response" 2>/dev/null || true)"

          available=false
          same_release=false
          if [[ "$previous_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
            && "$previous_release" =~ ^[0-9a-f]{40}$ ]]; then
            available=true
            if [[ "$previous_release" == "$RELEASE_SHA" ]]; then
              same_release=true
            fi
          else
            previous_version=""
            previous_release=""
            echo "No exact current release identity is available for rollback verification."
          fi
          {
            echo "available=$available"
            echo "previous_version=$previous_version"
            echo "previous_release=$previous_release"
            echo "same_release=$same_release"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail

          remote_dir="/app/data/.deploy/$RELEASE_SHA"
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            exec --app "$CLOUDRON_APP_ID" -- \
            bash -c "install -d -m 0750 '$remote_dir'"

          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            push --app "$CLOUDRON_APP_ID" \
            "build/myapes-$RELEASE_SHA.tar.gz" "$remote_dir/release.tar.gz"

      - name: Extract and activate uploaded release
        shell: bash
        run: |
          set -euo pipefail

          remote_dir="/app/data/.deploy/$RELEASE_SHA"
          remote_command="$(cat <<'BASH'
          set -euo pipefail
          remote_dir="$1"
          release_sha="$2"
          previous_release="$3"
          expected_controls_sha256="$4"
          tar --extract --gzip \
            --file "$remote_dir/release.tar.gz" \
            --directory "$remote_dir" \
            ./DEPLOYMENT-CONTROLS.sha256 \
            ./scripts/deploy/activate-release.sh \
            ./scripts/deploy/rollback-release.sh \
            ./scripts/deploy/cloudron-app.conf \
            ./scripts/deploy/cloudron-run.sh
          test -f "$remote_dir/DEPLOYMENT-CONTROLS.sha256"
          test ! -L "$remote_dir/DEPLOYMENT-CONTROLS.sha256"
          for control_path in \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh; do
            test -f "$remote_dir/$control_path"
            test ! -L "$remote_dir/$control_path"
          done
          actual_controls_sha256="$(sha256sum "$remote_dir/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$actual_controls_sha256" == "$expected_controls_sha256" ]]
          cat >"$remote_dir/expected-control-paths" <<'PATHS'
          scripts/deploy/activate-release.sh
          scripts/deploy/rollback-release.sh
          scripts/deploy/cloudron-app.conf
          scripts/deploy/cloudron-run.sh
          PATHS
          awk '{print $2}' "$remote_dir/DEPLOYMENT-CONTROLS.sha256" \
            >"$remote_dir/actual-control-paths"
          diff -u \
            "$remote_dir/expected-control-paths" \
            "$remote_dir/actual-control-paths"
          (
            cd "$remote_dir"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )
          bash "$remote_dir/scripts/deploy/activate-release.sh" \
            "$release_sha" "$previous_release" "$expected_controls_sha256"
          BASH
          )"
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            exec --app "$CLOUDRON_APP_ID" -- \
            bash -c "$remote_command" -- \
              "$remote_dir" "$RELEASE_SHA" \
              "${{ steps.previous.outputs.previous_release }}" \
              "$DEPLOYMENT_CONTROLS_SHA256"

      - name: Restart activated release
        id: restart
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            restart --app "$CLOUDRON_APP_ID"

      - name: Reconstitute authenticated runtime controls after restart
        id: runtime_controls
        if: always() && steps.restart.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          runtime_controls_command="$(cat <<'BASH'
          set -euo pipefail
          release_sha="$1"
          expected_controls_sha256="$2"
          archive_path="/app/data/.deploy/$release_sha/release.tar.gz"
          control_parent="/run/myapes-deployment-controls"
          control_root="/run/myapes-deployment-controls/$release_sha"
          temporary_root="$control_root.installing"

          restore_release_ownership() {
            local release_root="$1"
            local unexpected_owner=""

            [[ "$release_root" =~ ^/app/data/releases/[0-9a-f]{40}$ ]]
            test -d "$release_root"
            chown -hR root:root "$release_root"
            install -d -o www-data -g www-data -m 0770 "$release_root/bootstrap/cache"
            chown -hR www-data:www-data "$release_root/bootstrap/cache"
            chmod -R a-w "$release_root"
            chmod -R u+rwX,g+rwX,o-rwx "$release_root/bootstrap/cache"
            chmod 0555 "$release_root" "$release_root/public"

            unexpected_owner="$(find "$release_root" -xdev \
              ! -user root \
              ! -path "${release_root}/bootstrap/cache" \
              ! -path "${release_root}/bootstrap/cache/*" \
              -print -quit)"
            [[ -z "$unexpected_owner" ]]
          }

          restore_runtime_ownership() {
            local expected_release_sha="$1"
            local current_target=""
            local previous_target=""
            local unexpected_owner=""

            current_target="$(readlink -f /app/data/current)"
            [[ "$current_target" == "/app/data/releases/$expected_release_sha" ]]
            test -d /app/data/shared/storage
            test ! -L /app/data/shared/storage
            test -f /app/data/shared/.env
            test ! -L /app/data/shared/.env
            find /app/data -xdev \
              -path /app/data/shared/storage -prune -o \
              -path '/app/data/releases/*/bootstrap/cache' -prune -o \
              -exec chown -h root:root {} +
            chown root:root /app/data /app/data/releases /app/data/shared /app/data/apache
            chown root:root /app/data/run.sh /app/data/apache/app.conf
            chown -h root:root /app/data/current
            chown root:www-data /app/data/shared/.env
            chown -hR www-data:www-data /app/data/shared/storage
            chmod 0555 /app/data /app/data/releases /app/data/shared /app/data/apache
            chmod 0555 /app/data/run.sh
            chmod 0444 /app/data/apache/app.conf
            chmod 0640 /app/data/shared/.env

            restore_release_ownership "$current_target"
            if [[ -L /app/data/previous ]]; then
              previous_target="$(readlink -f /app/data/previous)"
              [[ "$previous_target" =~ ^/app/data/releases/[0-9a-f]{40}$ ]]
              [[ "$previous_target" != "$current_target" ]]
              chown -h root:root /app/data/previous
              restore_release_ownership "$previous_target"
            fi

            if [[ -d "/app/data/.deploy/$expected_release_sha" ]]; then
              test ! -L /app/data/.deploy
              test ! -L "/app/data/.deploy/$expected_release_sha"
              chown root:root /app/data/.deploy
              chown -hR root:root "/app/data/.deploy/$expected_release_sha"
              chmod 0700 /app/data/.deploy "/app/data/.deploy/$expected_release_sha"
            fi

            unexpected_owner="$(find /app/data -xdev \
              -path /app/data/shared/storage -prune -o \
              -path '/app/data/releases/*/bootstrap/cache' -prune -o \
              ! -user root -print -quit)"
            [[ -z "$unexpected_owner" ]]
          }

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_controls_sha256" =~ ^[0-9a-f]{64}$ ]]
          restore_runtime_ownership "$release_sha"
          test -f "$archive_path"
          test ! -L "$archive_path"
          case "$control_root" in
            "$control_parent/"*) ;;
            *) echo "Unsafe runtime-control destination."; exit 1 ;;
          esac

          rm -rf -- "$temporary_root"
          install -d -o root -g root -m 0700 \
            "$control_parent" "$temporary_root"
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$archive_path" \
            --directory "$temporary_root" \
            ./DEPLOYMENT-CONTROLS.sha256 \
            ./scripts/deploy/activate-release.sh \
            ./scripts/deploy/rollback-release.sh \
            ./scripts/deploy/cloudron-app.conf \
            ./scripts/deploy/cloudron-run.sh

          expected_files="$(printf '%s\n' \
            DEPLOYMENT-CONTROLS.sha256 \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh | LC_ALL=C sort)"
          actual_files="$(cd "$temporary_root" && find . -type f -printf '%P\n' | LC_ALL=C sort)"
          [[ "$actual_files" == "$expected_files" ]]
          test -z "$(find "$temporary_root" -type l -print -quit)"

          actual_controls_sha256="$(sha256sum "$temporary_root/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$actual_controls_sha256" == "$expected_controls_sha256" ]]
          expected_paths="$(printf '%s\n' \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh)"
          actual_paths="$(awk '{print $2}' "$temporary_root/DEPLOYMENT-CONTROLS.sha256")"
          [[ "$actual_paths" == "$expected_paths" ]]
          (
            cd "$temporary_root"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )

          chown -R root:root "$temporary_root"
          find "$temporary_root" -type d -exec chmod 0700 {} +
          chmod 0600 \
            "$temporary_root/DEPLOYMENT-CONTROLS.sha256" \
            "$temporary_root/scripts/deploy/cloudron-app.conf"
          chmod 0700 \
            "$temporary_root/scripts/deploy/activate-release.sh" \
            "$temporary_root/scripts/deploy/rollback-release.sh" \
            "$temporary_root/scripts/deploy/cloudron-run.sh"

          rm -rf -- "$control_root"
          mv "$temporary_root" "$control_root"
          test "$(stat -c '%U:%G' "$control_root")" = "root:root"
          test "$(stat -c '%a' "$control_root")" = "700"
          while IFS=':' read -r control_path expected_mode; do
            test "$(stat -c '%U:%G' "$control_root/$control_path")" = "root:root"
            test "$(stat -c '%a' "$control_root/$control_path")" = "$expected_mode"
          done <<'CONTROL_MODES'
          DEPLOYMENT-CONTROLS.sha256:600
          scripts/deploy/activate-release.sh:700
          scripts/deploy/rollback-release.sh:700
          scripts/deploy/cloudron-app.conf:600
          scripts/deploy/cloudron-run.sh:700
          CONTROL_MODES
          if sudo -u www-data test -w "$control_root"; then
            echo "Application user can replace authenticated runtime controls."
            exit 1
          fi

          current_target="$(readlink -f /app/data/current)"
          [[ "$current_target" == "/app/data/releases/$release_sha" ]]
          if [[ "$(stat -Lc '%U:%G' /app/data)" != "root:root" ]] \
            || sudo -u www-data test -w /app/data; then exit 1; fi
          if [[ "$(stat -c '%U:%G' /app/data/current)" != "root:root" ]] \
            || sudo -u www-data test -w /app/data/current; then exit 1; fi
          if [[ "$(stat -Lc '%U:%G' /app/data/current/public)" != "root:root" ]] \
            || sudo -u www-data test -w /app/data/current/public; then exit 1; fi
          if [[ -L /app/data/previous ]]; then
            if [[ "$(stat -c '%U:%G' /app/data/previous)" != "root:root" ]] \
              || sudo -u www-data test -w /app/data/previous; then exit 1; fi
            if [[ "$(stat -Lc '%U:%G' /app/data/previous/public)" != "root:root" ]] \
              || sudo -u www-data test -w /app/data/previous/public; then exit 1; fi
          fi
          if [[ "$(stat -Lc '%U:%G' /app/data/run.sh)" != "root:root" ]] \
            || sudo -u www-data test -w /app/data/run.sh; then exit 1; fi
          if [[ "$(stat -Lc '%U:%G' /app/data/apache/app.conf)" != "root:root" ]] \
            || sudo -u www-data test -w /app/data/apache/app.conf; then exit 1; fi
          [[ "$(stat -Lc '%U:%G' /app/data/shared)" == "root:root" ]]
          [[ "$(stat -Lc '%U:%G' /app/data/shared/.env)" == "root:www-data" ]]
          ! sudo -u www-data test -w /app/data/shared/.env
          sudo -u www-data test -w /app/data/current/bootstrap/cache
          sudo -u www-data test -w /app/data/shared/storage
          BASH
          )"
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            exec --app "$CLOUDRON_APP_ID" -- \
            bash -c "$runtime_controls_command" -- \
              "$RELEASE_SHA" "$DEPLOYMENT_CONTROLS_SHA256"

      - name: Verify exact release health and OIDC redirect
        id: verify
        if: steps.restart.outcome == 'success' && steps.runtime_controls.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          release_verified=false
          for _ in {1..18}; do
            response="$(curl --fail --silent --show-error --max-time 10 "$CLOUDRON_APP_URL/healthz" || true)"
            reported_version="$(jq -r '.version // empty' <<<"$response" 2>/dev/null || true)"
            reported_release="$(jq -r '.release // empty' <<<"$response" 2>/dev/null || true)"
            reported_status="$(jq -r '.status // empty' <<<"$response" 2>/dev/null || true)"
            reported_database="$(jq -r '.checks.database // empty' <<<"$response" 2>/dev/null || true)"
            reported_cache="$(jq -r '.checks.cache // empty' <<<"$response" 2>/dev/null || true)"
            reported_environment="$(jq -r '.checks.environment // empty' <<<"$response" 2>/dev/null || true)"

            [[ "$reported_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            [[ "$reported_release" =~ ^[0-9a-f]{40}$ ]] || continue

            if [[ "$reported_status" == "ok" \
              && "$reported_version" == "$APP_VERSION" \
              && "$reported_release" == "$RELEASE_SHA" \
              && "$reported_database" == "ok" \
              && "$reported_cache" == "ok" \
              && "$reported_environment" == "ok" ]]; then
              echo "Verified healthy app version $APP_VERSION at release $RELEASE_SHA."
              release_verified=true
              break
            fi

            sleep 5
          done

          if [[ "$release_verified" != true ]]; then
            echo "Health verification did not confirm app version $APP_VERSION and release $RELEASE_SHA."
            exit 1
          fi

          headers_dir="$(mktemp -d)"
          headers_file="$headers_dir/headers"
          trap 'rm -rf -- "$headers_dir"' EXIT

          status_code="$(curl --silent --show-error --max-time 10 \
            --output /dev/null \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            "$CLOUDRON_APP_URL/staff/auth/login")"

          if [[ "$status_code" != 302 ]]; then
            echo "OIDC redirect verification did not return HTTP 302."
            exit 1
          fi

          export OIDC_HEADERS_FILE="$headers_file"
          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          header_lines = Path(os.environ["OIDC_HEADERS_FILE"]).read_bytes().splitlines()
          locations = [
              line.split(b":", 1)[1].strip().decode("ascii")
              for line in header_lines
              if line.lower().startswith(b"location:")
          ]

          if len(locations) != 1:
              sys.exit("OIDC redirect verification returned an invalid Location header.")

          redirect = urlparse(locations[0])
          expected = urlparse(os.environ["CLOUDRON_OIDC_AUTH_URL"])
          params = parse_qs(redirect.query, keep_blank_values=True)

          def one(name):
              values = params.get(name, [])
              if len(values) != 1 or not values[0]:
                  sys.exit(f"OIDC redirect verification is missing {name}.")
              return values[0]

          if (redirect.scheme, redirect.netloc, redirect.path) != (
              expected.scheme,
              expected.netloc,
              expected.path,
          ):
              sys.exit("OIDC redirect verification targeted an unexpected provider.")

          if one("response_type") != "code":
              sys.exit("OIDC redirect verification used an unexpected response type.")
          if one("redirect_uri") != os.environ["CLOUDRON_OIDC_REDIRECT_URI"]:
              sys.exit("OIDC redirect verification used an unexpected callback.")
          if not {"openid", "profile", "email"}.issubset(set(one("scope").split())):
              sys.exit("OIDC redirect verification is missing a required scope.")

          one("client_id")
          one("state")
          one("nonce")

          if one("code_challenge_method") != "S256":
              sys.exit("OIDC redirect verification did not use S256.")
          if re.fullmatch(r"[A-Za-z0-9_-]{43}", one("code_challenge")) is None:
              sys.exit("OIDC redirect verification returned a malformed challenge.")

          print("OIDC redirect verification passed.")
          PY

      - name: Roll back code after failed release restart or verification
        id: rollback
        if: always() && steps.previous.outputs.same_release != 'true' && (steps.restart.outcome == 'failure' || steps.runtime_controls.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        env:
          PREVIOUS_RELEASE: ${{ steps.previous.outputs.previous_release }}
        run: |
          set -euo pipefail

          rollback_command="$(cat <<'BASH'
          set -euo pipefail
          previous_release="$1"
          failed_release="$2"
          expected_controls_sha256="$3"
          archive_path="/app/data/.deploy/$failed_release/release.tar.gz"
          control_parent="/run/myapes-deployment-controls"
          control_root="/run/myapes-deployment-controls/$failed_release"
          temporary_root="$control_root.installing"

          [[ "$previous_release" =~ ^[0-9a-f]{40}$ ]]
          [[ "$failed_release" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_controls_sha256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$archive_path"
          test ! -L "$archive_path"
          case "$control_root" in
            "$control_parent/"*) ;;
            *) echo "Unsafe rollback-control destination."; exit 1 ;;
          esac

          rm -rf -- "$temporary_root"
          install -d -o root -g root -m 0700 \
            "$control_parent" "$temporary_root"
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$archive_path" \
            --directory "$temporary_root" \
            ./DEPLOYMENT-CONTROLS.sha256 \
            ./scripts/deploy/activate-release.sh \
            ./scripts/deploy/rollback-release.sh \
            ./scripts/deploy/cloudron-app.conf \
            ./scripts/deploy/cloudron-run.sh

          expected_files="$(printf '%s\n' \
            DEPLOYMENT-CONTROLS.sha256 \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh | LC_ALL=C sort)"
          actual_files="$(cd "$temporary_root" && find . -type f -printf '%P\n' | LC_ALL=C sort)"
          [[ "$actual_files" == "$expected_files" ]]
          test -z "$(find "$temporary_root" -type l -print -quit)"

          actual_controls_sha256="$(sha256sum "$temporary_root/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$actual_controls_sha256" == "$expected_controls_sha256" ]]
          expected_paths="$(printf '%s\n' \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh)"
          actual_paths="$(awk '{print $2}' "$temporary_root/DEPLOYMENT-CONTROLS.sha256")"
          [[ "$actual_paths" == "$expected_paths" ]]
          (
            cd "$temporary_root"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )

          chown -R root:root "$temporary_root"
          find "$temporary_root" -type d -exec chmod 0700 {} +
          chmod 0600 \
            "$temporary_root/DEPLOYMENT-CONTROLS.sha256" \
            "$temporary_root/scripts/deploy/cloudron-app.conf"
          chmod 0700 \
            "$temporary_root/scripts/deploy/activate-release.sh" \
            "$temporary_root/scripts/deploy/rollback-release.sh" \
            "$temporary_root/scripts/deploy/cloudron-run.sh"
          rm -rf -- "$control_root"
          mv "$temporary_root" "$control_root"

          test -d "$control_root"
          test ! -L "$control_root"
          test "$(stat -c '%U:%G' "$control_root")" = "root:root"
          test "$(stat -c '%a' "$control_root")" = "700"
          test -f "$control_root/DEPLOYMENT-CONTROLS.sha256"
          test ! -L "$control_root/DEPLOYMENT-CONTROLS.sha256"
          for control_path in \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh; do
            test -f "$control_root/$control_path"
            test ! -L "$control_root/$control_path"
          done
          while IFS=':' read -r control_path expected_mode; do
            test "$(stat -c '%U:%G' "$control_root/$control_path")" = "root:root"
            test "$(stat -c '%a' "$control_root/$control_path")" = "$expected_mode"
          done <<'CONTROL_MODES'
          DEPLOYMENT-CONTROLS.sha256:600
          scripts/deploy/activate-release.sh:700
          scripts/deploy/rollback-release.sh:700
          scripts/deploy/cloudron-app.conf:600
          scripts/deploy/cloudron-run.sh:700
          CONTROL_MODES
          actual_controls_sha256="$(sha256sum "$control_root/DEPLOYMENT-CONTROLS.sha256" | awk '{print $1}')"
          [[ "$actual_controls_sha256" == "$expected_controls_sha256" ]]
          expected_paths="$(printf '%s\n' \
            scripts/deploy/activate-release.sh \
            scripts/deploy/rollback-release.sh \
            scripts/deploy/cloudron-app.conf \
            scripts/deploy/cloudron-run.sh)"
          actual_paths="$(awk '{print $2}' "$control_root/DEPLOYMENT-CONTROLS.sha256")"
          [[ "$actual_paths" == "$expected_paths" ]]
          (
            cd "$control_root"
            sha256sum --check --strict DEPLOYMENT-CONTROLS.sha256
          )
          if sudo -u www-data test -w "$control_root"; then
            echo "Application user can replace authenticated rollback controls."
            exit 1
          fi
          bash "$control_root/scripts/deploy/rollback-release.sh" \
            "$previous_release" "$failed_release" "$expected_controls_sha256" "$control_root"
          BASH
          )"
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            exec --app "$CLOUDRON_APP_ID" -- \
            bash -c "$rollback_command" -- \
              "$PREVIOUS_RELEASE" "$RELEASE_SHA" \
              "$DEPLOYMENT_CONTROLS_SHA256"

          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            restart --app "$CLOUDRON_APP_ID"

      - name: Verify restored release effective Laravel environment
        if: always() && steps.previous.outputs.same_release != 'true' && (steps.restart.outcome == 'failure' || steps.runtime_controls.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail

          restored_environment="$(
            cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
              exec --app "$CLOUDRON_APP_ID" -- \
              sudo -E -u www-data /usr/bin/php8.4 \
                /app/data/current/artisan env --no-ansi
          )"

          if ! grep -Eq '(^|[[:space:]])production([[:space:]]|$)' \
            <<<"$restored_environment"; then
            echo "Restored release effective Laravel environment verification failed."
            exit 1
          fi

      - name: Verify restored release health and OIDC redirect
        if: always() && steps.previous.outputs.same_release != 'true' && (steps.restart.outcome == 'failure' || steps.runtime_controls.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        env:
          PREVIOUS_AVAILABLE: ${{ steps.previous.outputs.available }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
          PREVIOUS_RELEASE: ${{ steps.previous.outputs.previous_release }}
        run: |
          set -euo pipefail

          if [[ "$PREVIOUS_AVAILABLE" != true ]]; then
            echo "Rollback completed, but no exact previous release identity was captured."
            exit 1
          fi

          restored=false
          for _ in {1..18}; do
            response="$(curl --fail --silent --show-error --max-time 10 "$CLOUDRON_APP_URL/healthz" || true)"
            reported_version="$(jq -r '.version // empty' <<<"$response" 2>/dev/null || true)"
            reported_release="$(jq -r '.release // empty' <<<"$response" 2>/dev/null || true)"
            reported_status="$(jq -r '.status // empty' <<<"$response" 2>/dev/null || true)"
            reported_database="$(jq -r '.checks.database // empty' <<<"$response" 2>/dev/null || true)"
            reported_cache="$(jq -r '.checks.cache // empty' <<<"$response" 2>/dev/null || true)"

            [[ "$reported_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            [[ "$reported_release" =~ ^[0-9a-f]{40}$ ]] || continue

            if [[ "$reported_status" == "ok" \
              && "$reported_version" == "$PREVIOUS_VERSION" \
              && "$reported_release" == "$PREVIOUS_RELEASE" \
              && "$reported_database" == "ok" \
              && "$reported_cache" == "ok" ]]; then
              restored=true
              break
            fi

            sleep 5
          done

          if [[ "$restored" != true ]]; then
            echo "Rollback health verification did not confirm the captured previous release."
            exit 1
          fi

          headers_dir="$(mktemp -d)"
          headers_file="$headers_dir/headers"
          trap 'rm -rf -- "$headers_dir"' EXIT

          status_code="$(curl --silent --show-error --max-time 10 \
            --output /dev/null \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            "$CLOUDRON_APP_URL/staff/auth/login")"
          [[ "$status_code" == 302 ]]

          export OIDC_HEADERS_FILE="$headers_file"
          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          locations = [
              line.split(b":", 1)[1].strip().decode("ascii")
              for line in Path(os.environ["OIDC_HEADERS_FILE"]).read_bytes().splitlines()
              if line.lower().startswith(b"location:")
          ]
          if len(locations) != 1:
              sys.exit("Restored OIDC verification returned an invalid Location header.")

          redirect = urlparse(locations[0])
          expected = urlparse(os.environ["CLOUDRON_OIDC_AUTH_URL"])
          params = parse_qs(redirect.query, keep_blank_values=True)

          def one(name):
              values = params.get(name, [])
              if len(values) != 1 or not values[0]:
                  sys.exit(f"Restored OIDC verification is missing {name}.")
              return values[0]

          if (redirect.scheme, redirect.netloc, redirect.path) != (
              expected.scheme,
              expected.netloc,
              expected.path,
          ):
              sys.exit("Restored OIDC verification targeted an unexpected provider.")
          if one("response_type") != "code":
              sys.exit("Restored OIDC verification used an unexpected response type.")
          if one("redirect_uri") != os.environ["CLOUDRON_OIDC_REDIRECT_URI"]:
              sys.exit("Restored OIDC verification used an unexpected callback.")
          if not {"openid", "profile", "email"}.issubset(set(one("scope").split())):
              sys.exit("Restored OIDC verification is missing a required scope.")

          one("client_id")
          one("state")
          one("nonce")
          if one("code_challenge_method") != "S256":
              sys.exit("Restored OIDC verification did not use S256.")
          if re.fullmatch(r"[A-Za-z0-9_-]{43}", one("code_challenge")) is None:
              sys.exit("Restored OIDC verification returned a malformed challenge.")
          PY

      - name: Remove deployment staging after accepted outcome
        if: always() && (steps.verify.outcome == 'success' || steps.rollback.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          cleanup_command="$(cat <<'BASH'
          set -euo pipefail
          release_sha="$1"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          staging_root="/app/data/.deploy/$release_sha"
          case "$staging_root" in
            /app/data/.deploy/[0-9a-f][0-9a-f]*) rm -rf -- "$staging_root" ;;
            *) echo "Unsafe deployment staging cleanup path."; exit 1 ;;
          esac
          BASH
          )"
          cloudron --server "$CLOUDRON_FQDN" --token "$CLOUDRON_TOKEN" \
            exec --app "$CLOUDRON_APP_ID" -- \
            bash -c "$cleanup_command" -- "$RELEASE_SHA"

      - name: Fail an idempotent deployment after restart or verification failure
        if: always() && steps.previous.outputs.same_release == 'true' && (steps.restart.outcome == 'failure' || steps.runtime_controls.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        run: |
          echo "The already-active release failed verification; no stale rollback was attempted."
          exit 1

      - name: Fail deployment after attempted rollback
        if: always() && steps.previous.outputs.same_release != 'true' && (steps.restart.outcome == 'failure' || steps.runtime_controls.outcome == 'failure' || steps.verify.outcome == 'failure')
        shell: bash
        run: |
          echo "Deployment failed after restart or verification; any attempted code rollback did not make this deployment successful."
          echo "Database migrations were retained; use the pre-deployment Cloudron backup if database recovery is required."
          exit 1
